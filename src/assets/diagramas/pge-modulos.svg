  <title id="ttl">Módulos del sistema institucional — diseño, calidad y adopción (PGE, 2024)</title>
  <desc id="dsc">Cuatro frentes del trabajo sobre los módulos del sistema institucional: mockups, control de calidad con pruebas, seguimiento de registros y reporte de errores, Manual de Usuario final, y capacitación y soporte a usuarios de los 9 departamentos de Bolivia. Banda inferior: soporte técnico de hardware, software, periféricos y conectividad de red.</desc>
