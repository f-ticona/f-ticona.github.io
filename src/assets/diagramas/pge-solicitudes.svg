<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Sistema centralizado de gestión de solicitudes de información (PGE, 2024–2025)</title>
  <desc id="dsc">Tres capas —Angular frontend, Java Spring Boot backend en microservicios y PostgreSQL— y dos integraciones externas: Ciudadanía Digital de AGETIC para autenticación y aprobación digital, y firma digital de AGETIC sobre PDF en los módulos de respuesta a entidades externas.</desc>
